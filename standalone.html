<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time air quality monitoring dashboard with interactive map, pollutant breakdown and health alerts.">
    <title>AirWatch — Air Quality Monitoring Dashboard</title>

    <!-- Leaflet (map library) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="">
    <style>
/* ============================================================
   AirWatch — Air Quality Monitoring Dashboard
   Minimalism × Brutalism
   - Monochrome ink-on-paper, mono/uppercase type
   - Thick 2–3px borders, hard offset shadows, zero radius
   - Semantic AQI colors are the only color
   Zero-dependency custom CSS (no build step required)
   ============================================================ */

:root {
    --paper: #f4f2ed;
    --card: #ffffff;
    --ink: #111111;
    --muted: #6f6c66;
    --border-w: 2px;
    --shadow: 4px 4px 0 var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink);

    /* Semantic AQI colors (US-EPA) — keep in sync with configs/JS */
    --good: #00c853;
    --moderate: #ffd600;
    --usg: #ff8f00;
    --unhealthy: #e53935;
    --very-unhealthy: #8e24aa;
    --hazardous: #7e0023;

    --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
}

body {
    font-family: var(--mono);
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
}

a { color: var(--ink); }

::selection { background: var(--ink); color: var(--paper); }

/* ---------- Top bar ---------- */

.topbar {
    background: var(--paper);
    border-bottom: 3px solid var(--ink);
}

.topbar-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0.9rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
}

.brand {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
}

/* "Live" indicator: a static-looking blinking block */
.brand-dot {
    width: 10px; height: 10px;
    border-radius: 0;
    background: var(--ink);
    align-self: center;
    animation: pulse 2.5s steps(2, jump-none) infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
}

.brand h1 {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}

.brand-sub {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.22em;
}

.search-form {
    display: flex;
    gap: 0.6rem;
    flex: 1;
    max-width: 460px;
}

.search-input {
    flex: 1;
    min-width: 0;
    padding: 0.6rem 0.9rem;
    border-radius: 0;
    border: var(--border-w) solid var(--ink);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: box-shadow 0.1s, transform 0.1s;
}

.search-input::placeholder {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.75rem;
}

.search-input:focus {
    box-shadow: var(--shadow-sm);
    transform: translate(-1px, -1px);
}

/* ---------- Buttons ---------- */

.btn {
    padding: 0.6rem 1.2rem;
    border-radius: 0;
    border: var(--border-w) solid var(--ink);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: box-shadow 0.1s, transform 0.1s;
}

.btn:active {
    transform: translate(3px, 3px);
    box-shadow: none;
}

.btn:focus-visible,
.search-input:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
}

.btn-primary {
    background: var(--ink);
    color: var(--paper);
    box-shadow: var(--shadow-sm);
}

.btn-primary:hover {
    transform: translate(1px, 1px);
    box-shadow: 2px 2px 0 var(--ink);
}

.btn-outline {
    background: var(--card);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
}

.btn-outline:hover {
    transform: translate(1px, 1px);
    box-shadow: 2px 2px 0 var(--ink);
}

.btn-block { width: 100%; margin-top: 1.25rem; }

/* ---------- Layout ---------- */

.layout {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 400px;
    min-height: 0;
}

@media (max-width: 960px) {
    .layout {
        grid-template-columns: 1fr;
    }
    .map-section {
        height: 45dvh;
        border-right: none;
        border-bottom: 3px solid var(--ink);
    }
}

.map-section {
    position: relative;
    min-height: 320px;
    border-right: 3px solid var(--ink);
}

.map {
    width: 100%;
    height: 100%;
    background: var(--paper);
}

.map-legend {
    position: absolute;
    bottom: 20px;
    left: 14px;
    z-index: 1000;
    background: var(--card);
    border: var(--border-w) solid var(--ink);
    border-radius: 0;
    box-shadow: var(--shadow-sm);
    padding: 0.55rem 0.8rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 0.9rem;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink);
    max-width: min(90%, 480px);
}

.legend-item {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    white-space: nowrap;
}

.legend-swatch {
    width: 10px; height: 10px;
    border-radius: 0;
    border: 1px solid var(--ink);
    display: inline-block;
    flex-shrink: 0;
}

/* ---------- Details panel ---------- */

.details-panel {
    background: var(--card);
    border-left: 2px solid var(--ink);
    padding: 1.5rem;
    overflow-y: auto;
}

@media (max-width: 960px) {
    .details-panel { border-left: none; }
}

.state-box {
    padding: 2.5rem 1rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.state-error { color: var(--unhealthy); }

.hidden { display: none !important; }

.city-header h2 {
    font-size: 1.9rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 0.3rem;
    word-break: break-word;
}

.city-meta {
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
}

.updated-at {
    color: var(--muted);
    font-size: 0.7rem;
    margin-top: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
}

/* ---------- AQI hero ---------- */

.aqi-hero {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin: 1.5rem 0;
    padding: 1.2rem;
    background: var(--card);
    border: var(--border-w) solid var(--ink);
    border-radius: 0;
    box-shadow: 6px 6px 0 var(--ink);
}

/* Square "ring": the JS sets --ring to the AQI category color */
.aqi-ring {
    --ring: var(--good);
    flex-shrink: 0;
    width: 108px; height: 108px;
    border-radius: 0;
    border: 7px solid var(--ring);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--card);
}

.aqi-value {
    font-size: 2.1rem;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
}

.aqi-label {
    font-size: 0.58rem;
    color: var(--muted);
    letter-spacing: 0.16em;
    margin-top: 0.3rem;
    text-transform: uppercase;
    white-space: nowrap;
}

.aqi-summary {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    min-width: 0;
}

/* Square badge; JS sets background (and, for contrast, text color) */
.category-badge {
    align-self: flex-start;
    padding: 0.35rem 0.75rem;
    border-radius: 0;
    border: var(--border-w) solid var(--ink);
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink);
    background: var(--good);
}

.dominant {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.02em;
}

/* ---------- Alert banner ---------- */

.alert-banner {
    background: var(--card);
    border: 3px solid var(--unhealthy);
    border-radius: 0;
    box-shadow: var(--shadow);
    padding: 0.9rem 1.1rem;
    margin-bottom: 1.5rem;
}

.alert-banner strong {
    display: block;
    color: var(--unhealthy);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-bottom: 0.4rem;
}

.alert-banner p {
    font-size: 0.8rem;
    line-height: 1.55;
    color: var(--ink);
}

/* ---------- Pollutant list ---------- */

.section-title {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--muted);
    margin: 1rem 0 1rem;
    padding-bottom: 0.4rem;
    border-bottom: var(--border-w) solid var(--ink);
}

.pollutant-list {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
}

.pollutant-row {
    display: grid;
    grid-template-columns: 52px 1fr 110px;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.78rem;
}

.pollutant-name {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink);
}

.pollutant-bar-track {
    height: 16px;
    background: var(--paper);
    border-radius: 0;
    overflow: hidden;
    border: var(--border-w) solid var(--ink);
}

.pollutant-bar {
    display: block;
    height: 100%;
    border-radius: 0;
    transition: width 0.4s steps(8, end);
    min-width: 3px;
}

.pollutant-value {
    text-align: right;
    color: var(--muted);
    font-size: 0.72rem;
    font-variant-numeric: tabular-nums;
}

/* ---------- Footer ---------- */

.footer {
    background: var(--paper);
    border-top: 3px solid var(--ink);
    padding: 0.85rem 1.25rem;
    text-align: center;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    color: var(--muted);
}

.footer a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
}

.footer a:hover { text-decoration-thickness: 2px; }

/* ---------- Leaflet popup theming ---------- */

.leaflet-popup-content-wrapper {
    background: var(--card);
    color: var(--ink);
    border-radius: 0;
    border: var(--border-w) solid var(--ink);
    box-shadow: var(--shadow-sm) !important;
    font-family: var(--mono);
}

.leaflet-popup-tip { background: var(--card); }

.popup-city {
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
}

.popup-aqi {
    font-size: 0.8rem;
    color: var(--muted);
}

.leaflet-container a { color: var(--ink); }

</style>
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-dot" aria-hidden="true"></span>
                <h1>AirWatch</h1>
                <span class="brand-sub">Air Quality Dashboard</span>
            </div>

            <form id="searchForm" class="search-form" role="search">
                <input type="search" id="searchInput" class="search-input"
                       placeholder="Search a city (e.g. Tokyo)…" autocomplete="off" aria-label="Search city">
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </div>
    </header>

    <main class="layout">
        <!-- Map -->
        <section class="map-section" aria-label="Air quality map">
            <div id="map" class="map"></div>
            <div class="map-legend" id="mapLegend" aria-label="AQI legend">
                <!-- Populated by app.js with the active AQI standard's categories -->
            </div>
        </section>

        <!-- Details panel -->
        <aside class="details-panel" aria-label="Selected city details">
            <div id="loadingState" class="state-box">
                <p>Loading air quality data…</p>
            </div>

            <div id="errorState" class="state-box state-error hidden">
                <p id="errorText">Could not load data.</p>
            </div>

            <div id="cityDetails" class="hidden">
                <div class="city-header">
                    <h2 id="cityName">—</h2>
                    <p id="cityMeta" class="city-meta">—</p>
                    <p class="updated-at">Updated <span id="updatedAt">—</span></p>
                </div>

                <div class="aqi-hero">
                    <div class="aqi-ring" id="aqiRing">
                        <span class="aqi-value" id="aqiValue">—</span>
                        <span class="aqi-label" id="aqiStandard">AQI</span>
                    </div>
                    <div class="aqi-summary">
                        <span id="aqiCategory" class="category-badge">—</span>
                        <p id="dominantPollutant" class="dominant">—</p>
                    </div>
                </div>

                <div id="alertBanner" class="alert-banner hidden" role="alert">
                    <strong>Health alert</strong>
                    <p id="alertText"></p>
                </div>

                <h3 class="section-title">Pollutant breakdown</h3>
                <div id="pollutantList" class="pollutant-list"></div>

                <button id="refreshBtn" class="btn btn-outline btn-block">↻ Refresh</button>
            </div>
        </aside>
    </main>

    <footer class="footer">
        <p>Data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo Air Quality API</a> ·
           Map: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ·
           Basemap labels in English · Built with Leaflet</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script>
// ==== js/config.js ====
// ============================================================
// config.js — default cities, AQI categories, API endpoints
// ============================================================

// Cities shown on the map at startup.
const DEFAULT_CITIES = [
    { name: "Delhi",     country: "India",        lat: 28.6139,  lon: 77.2090 },
    { name: "Beijing",   country: "China",        lat: 39.9042,  lon: 116.4074 },
    { name: "London",    country: "United Kingdom", lat: 51.5074, lon: -0.1278 },
    { name: "New York",  country: "United States", lat: 40.7128, lon: -74.0060 },
    { name: "Tokyo",     country: "Japan",        lat: 35.6762,  lon: 139.6503 },
    { name: "São Paulo", country: "Brazil",       lat: -23.5505, lon: -46.6333 },
    { name: "Lahore",    country: "Pakistan",     lat: 31.5204,  lon: 74.3587 },
    { name: "Sydney",    country: "Australia",    lat: -33.8688, lon: 151.2093 }
];

// Map tile layers.
// Primary layer renders all place names in English; the fallback uses OSM's
// default tiles (local-language labels) in case the primary source is down.
const TILE_LAYERS = {
    primary: {
        url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        attribution: 'Tiles &copy; Esri — Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom',
        maxZoom: 18
    },
    fallback: {
        url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 18
    }
};

// AQI categories (US-EPA style).
// range: [min, max) of AQI values in this category.
const AQI_CATEGORIES = [
    {
        key: "good",
        label: "Good",
        range: [0, 51],
        color: "#00c853",
        advice: "Air quality is satisfactory and poses little or no risk."
    },
    {
        key: "moderate",
        label: "Moderate",
        range: [51, 101],
        color: "#ffd600",
        advice: "Acceptable air quality. Unusually sensitive people should consider limiting prolonged outdoor exertion."
    },
    {
        key: "usg",
        label: "Unhealthy for Sensitive Groups",
        range: [101, 151],
        color: "#ff8f00",
        advice: "Sensitive groups (children, elderly, people with heart or lung disease) may experience health effects. General public is less likely to be affected."
    },
    {
        key: "unhealthy",
        label: "Unhealthy",
        range: [151, 201],
        color: "#e53935",
        advice: "Everyone may begin to experience health effects. Avoid prolonged outdoor exertion; keep windows closed if possible."
    },
    {
        key: "very-unhealthy",
        label: "Very Unhealthy",
        range: [201, 301],
        color: "#8e24aa",
        advice: "Health alert: the risk of health effects is increased for everyone. Avoid outdoor activity."
    },
    {
        key: "hazardous",
        label: "Hazardous",
        range: [301, Infinity],
        color: "#7e0023",
        advice: "Emergency conditions: everyone is more likely to be affected. Stay indoors and filter air if possible."
    }
];

// AQI standards we support.
// "us"   — US EPA AQI (Open-Meteo's native us_aqi, used worldwide).
// "cpcb" — India CPCB NAQI scale: for the same concentrations it rates
//          Indian smog much higher (e.g. PM2.5 118 µg/m³ → CPCB ~292 "Poor"
//          vs US AQI 187 "Unhealthy"), matching Indian weather apps.
const AQI_STANDARDS = {
    us: {
        key: "us",
        label: "US EPA AQI",
        short: "US EPA",
        categories: AQI_CATEGORIES,
        // Health-alert banner kicks in at Unhealthy (151+).
        alertMin: 151
    },
    cpcb: {
        key: "cpcb",
        label: "India CPCB (NAQI)",
        short: "CPCB India",
        categories: [
            {
                key: "good",
                label: "Good",
                range: [0, 51],
                color: "#00a651",
                advice: "Minimal impact on health."
            },
            {
                key: "satisfactory",
                label: "Satisfactory",
                range: [51, 101],
                color: "#84cc16",
                advice: "Typical Indian air on a clean day. Minor breathing discomfort possible for sensitive people."
            },
            {
                key: "moderate",
                label: "Moderate",
                range: [101, 201],
                color: "#ffd600",
                advice: "Breathing discomfort for people with lung or heart disease, children and older adults."
            },
            {
                key: "poor",
                label: "Poor",
                range: [201, 301],
                color: "#f97316",
                advice: "Breathing discomfort for most people on prolonged exposure. Limit outdoor activity."
            },
            {
                key: "very-poor",
                label: "Very Poor",
                range: [301, 401],
                color: "#e53935",
                advice: "Respiratory illness on prolonged exposure. Avoid outdoor activity."
            },
            {
                key: "severe",
                label: "Severe",
                range: [401, Infinity],
                color: "#7e0023",
                advice: "Serious health impact even for healthy people. Stay indoors and filter air if possible."
            }
        ],
        // Health-alert banner kicks in at Poor (201+) — comparable concern level.
        alertMin: 201
    }
};

// Pollutants we display, with their display names and max µg/m³
// used for scaling the breakdown bars.
const POLLUTANTS = [
    { key: "pm2_5", label: "PM2.5", barMax: 250 },
    { key: "pm10",  label: "PM10",  barMax: 400 },
    { key: "o3",    label: "O₃",    barMax: 240 },
    { key: "no2",   label: "NO₂",   barMax: 400 },
    { key: "so2",   label: "SO₂",   barMax: 500 },
    { key: "co",    label: "CO",    barMax: 10000 }
];

// API endpoints (Open-Meteo — free, no API key required).
const AIR_QUALITY_API = "https://air-quality-api.open-meteo.com/v1/air-quality";
const GEOCODING_API = "https://geocoding-api.open-meteo.com/v1/search";

// Geographic bounds used when fetching city data.
const FETCH_PARAMS = {
    // NOTE: Open-Meteo now requires full variable names (ozone, nitrogen_dioxide,
    // sulphur_dioxide, carbon_monoxide) rather than the short o3/no2/so2/co aliases.
    current: "pm2_5,pm10,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide,us_aqi",
    timezone: "auto"
};

// Map Open-Meteo's response keys to the internal short keys used by aqi.js.
const POLLUTANT_KEY_MAP = {
    pm2_5: "pm2_5",
    pm10: "pm10",
    ozone: "o3",
    nitrogen_dioxide: "no2",
    sulphur_dioxide: "so2",
    carbon_monoxide: "co"
};


// ==== js/aqi.js ====
// ============================================================
// aqi.js — AQI computation and category helpers
// ============================================================


// Which AQI scale to use for a location. India officially uses the CPCB
// National Air Quality Index (NAQI); everywhere else falls back to US EPA.
function standardForCity(city) {
    return city && (city.country || "").trim() === "India" ? "cpcb" : "us";
}

/**
 * Return the category object for a given AQI value on a given scale.
 * @param {number} aqi
 * @param {"us"|"cpcb"} standard
 */
function getAqiCategory(aqi, standard = "us") {
    if (typeof aqi !== "number" || Number.isNaN(aqi)) return null;
    const categories = (AQI_STANDARDS[standard] || AQI_STANDARDS.us).categories;
    return categories.find(c => aqi >= c.range[0] && aqi < c.range[1]) || null;
}

/**
 * Compute an overall AQI from individual pollutant concentrations
 * using US-EPA breakpoints. Returns { aqi, dominant } where dominant
 * is the pollutant key that produced the highest sub-index.
 *
 * Pollutant keys here match Open-Meteo's current values.
 */
const EPA_BREAKPOINTS = {
    pm2_5: [
        [0.0, 12.0, 0, 50],
        [12.1, 35.4, 51, 100],
        [35.5, 55.4, 101, 150],
        [55.5, 150.4, 151, 200],
        [150.5, 250.4, 201, 300],
        [250.5, 500.4, 301, 500]
    ],
    pm10: [
        [0, 54, 0, 50],
        [55, 154, 51, 100],
        [155, 254, 101, 150],
        [255, 354, 151, 200],
        [355, 424, 201, 300],
        [425, 604, 301, 500]
    ],
    o3: [
        [0, 108, 0, 50],
        [109, 214, 51, 100],
        [215, 424, 101, 150],
        [425, 504, 151, 200],
        [505, 604, 201, 300],
        [605, 804, 301, 500]
    ],
    no2: [
        [0, 53, 0, 50],
        [54, 100, 51, 100],
        [101, 360, 101, 150],
        [361, 649, 151, 200],
        [650, 1249, 201, 300],
        [1250, 2049, 301, 500]
    ],
    so2: [
        [0, 35, 0, 50],
        [36, 75, 51, 100],
        [76, 185, 101, 150],
        [186, 304, 151, 200],
        [305, 604, 201, 300],
        [605, 1004, 301, 500]
    ],
    co: [
        [0, 4400, 0, 50],
        [4450, 9400, 51, 100],
        [9450, 12400, 101, 150],
        [12450, 15400, 151, 200],
        [15450, 30400, 201, 300],
        [30500, 50400, 301, 500]
    ]
};

/**
 * India CPCB NAQI sub-index breakpoints (µg/m³ for all pollutants, CO in µg/m³
 * = mg/m³ × 1000). Segment boundaries are the official CPCB tables; the
 * sub-index in a segment is interpolated linearly.
 */
const CPCB_BREAKPOINTS = {
    pm2_5: [
        [0, 30, 0, 50],
        [30, 60, 51, 100],
        [60, 90, 101, 200],
        [90, 120, 201, 300],
        [120, 250, 301, 400],
        [250, 500, 401, 500]
    ],
    pm10: [
        [0, 50, 0, 50],
        [50, 100, 51, 100],
        [100, 250, 101, 200],
        [250, 350, 201, 300],
        [350, 430, 301, 400],
        [430, 1000, 401, 500]
    ],
    o3: [
        [0, 50, 0, 50],
        [50, 100, 51, 100],
        [100, 168, 101, 200],
        [168, 208, 201, 300],
        [208, 748, 301, 400],
        [748, 1496, 401, 500]
    ],
    no2: [
        [0, 40, 0, 50],
        [40, 80, 51, 100],
        [80, 180, 101, 200],
        [180, 280, 201, 300],
        [280, 400, 301, 400],
        [400, 802, 401, 500]
    ],
    so2: [
        [0, 40, 0, 50],
        [40, 80, 51, 100],
        [80, 380, 101, 200],
        [380, 800, 201, 300],
        [800, 1600, 301, 400],
        [1600, 2400, 401, 500]
    ],
    co: [
        [0, 1000, 0, 50],
        [1000, 2000, 51, 100],
        [2000, 10000, 101, 200],
        [10000, 17000, 201, 300],
        [17000, 34000, 301, 400],
        [34000, 68000, 401, 500]
    ]
};

const BREAKPOINT_TABLES = { us: EPA_BREAKPOINTS, cpcb: CPCB_BREAKPOINTS };

/**
 * Convert one pollutant concentration to a sub-AQI index on a given scale.
 * @param {string} pollutantKey
 * @param {number} conc  concentration in µg/m³ (CO in µg/m³)
 * @param {"us"|"cpcb"} standard
 * @returns {number|null} sub-index or null if not computable
 */
function pollutantSubIndex(pollutantKey, conc, standard = "us") {
    const table = (BREAKPOINT_TABLES[standard] || EPA_BREAKPOINTS)[pollutantKey];
    if (!table || typeof conc !== "number" || Number.isNaN(conc) || conc < 0) return null;

    for (const [cLow, cHigh, iLow, iHigh] of table) {
        if (conc <= cHigh) {
            // Piecewise-linear interpolation.
            if (cHigh === cLow) return iHigh;
            return Math.round(((iHigh - iLow) / (cHigh - cLow)) * (conc - cLow) + iLow);
        }
    }
    // Above the highest breakpoint — clamp to the top of the scale.
    return 500;
}

/**
 * Compute overall AQI from a set of current pollutant values on a given scale.
 * @param {Object<string, number>} pollutants e.g. { pm2_5: 23.4, ... }
 * @param {"us"|"cpcb"} standard
 * @returns {{ aqi: number, dominant: string } | null}
 */
function computeAqi(pollutants, standard = "us") {
    let best = null;
    for (const [key, conc] of Object.entries(pollutants)) {
        const sub = pollutantSubIndex(key, conc, standard);
        if (sub !== null && (best === null || sub > best.aqi)) {
            best = { aqi: sub, dominant: key };
        }
    }
    return best;
}

/**
 * Human-readable label for a pollutant key.
 */
const POLLUTANT_LABELS = {
    pm2_5: "PM2.5",
    pm10: "PM10",
    o3: "Ozone (O₃)",
    no2: "Nitrogen Dioxide (NO₂)",
    so2: "Sulphur Dioxide (SO₂)",
    co: "Carbon Monoxide (CO)"
};

function pollutantLabel(key) {
    return POLLUTANT_LABELS[key] || key;
}


// ==== js/airQuality.js ====
// ============================================================
// airQuality.js — Open-Meteo fetch layer
// ============================================================



/**
 * Fetch current air quality for a coordinate.
 * Returns a normalized object:
 * {
 *   pollutants: { pm2_5, pm10, o3, no2, so2, co },
 *   standards: { us: { aqi, dominant }|null, cpcb: { aqi, dominant }|null },
 *   aqi, dominant,        // US-EPA values (legacy convenience fields)
 *   usAqi                 // API-provided US AQI, may be null
 * }
 * @param {number} lat
 * @param {number} lon
 */
async function fetchAirQuality(lat, lon) {
    const url = `${AIR_QUALITY_API}?latitude=${lat}&longitude=${lon}` +
        `&current=${FETCH_PARAMS.current}&timezone=${FETCH_PARAMS.timezone}`;

    const res = await fetch(url);
    if (!res.ok) {
        throw new Error(`Air quality API error (${res.status})`);
    }
    const data = await res.json();
    const cur = data.current;
    if (!cur) throw new Error("Malformed API response");

    const pollutants = {};
    for (const [apiKey, internalKey] of Object.entries(POLLUTANT_KEY_MAP)) {
        const v = cur[apiKey];
        if (typeof v === "number") pollutants[internalKey] = v;
    }
    if (Object.keys(pollutants).length === 0) {
        throw new Error("No pollutant data available for this location");
    }

    // Overall AQI on both supported scales from the same concentrations.
    const us = computeAqi(pollutants, "us");
    const cpcb = computeAqi(pollutants, "cpcb");

    return {
        pollutants,
        standards: { us, cpcb },
        aqi: us ? us.aqi : (cur.us_aqi ?? null),
        dominant: us ? us.dominant : null,
        usAqi: cur.us_aqi ?? null,
        fetchedAt: new Date()
    };
}

/**
 * Search a city by name using Open-Meteo's geocoding API.
 * Returns an array of matches: { name, country, admin1, lat, lon }.
 * @param {string} query
 */
async function searchCity(query) {
    const url = `${GEOCODING_API}?name=${encodeURIComponent(query)}&count=5&language=en&format=json`;
    const res = await fetch(url);
    if (!res.ok) {
        throw new Error(`Geocoding API error (${res.status})`);
    }
    const data = await res.json();
    return (data.results || []).map(r => ({
        name: r.name,
        country: r.country || "",
        admin1: r.admin1 || "",
        lat: r.latitude,
        lon: r.longitude
    }));
}


// ==== js/map.js ====
// ============================================================
// map.js — Leaflet map + color-coded city markers
// ============================================================



let map = null;
const markers = new Map(); // cityKey -> leaflet marker
let onSelect = null;       // callback(city)

/**
 * Initialize the Leaflet map.
 * @param {(city: Object) => void} selectCallback called when a marker is clicked
 */
function initMap(selectCallback) {
    onSelect = selectCallback;

    map = L.map("map", {
        center: [22, 30],
        zoom: 2.5,
        minZoom: 2,
        worldCopyJump: true
    });

    // Basemap with English place-name labels; falls back to OSM default
    // tiles (local-language labels) if the primary tile source errors out.
    let primaryFailed = false;
    const primary = L.tileLayer(TILE_LAYERS.primary.url, {
        maxZoom: 18,
        attribution: TILE_LAYERS.primary.attribution
    });
    primary.on("tileerror", () => {
        if (primaryFailed) return;
        primaryFailed = true;
        map.removeLayer(primary);
        L.tileLayer(TILE_LAYERS.fallback.url, {
            maxZoom: 18,
            attribution: TILE_LAYERS.fallback.attribution
        }).addTo(map);
    });
    primary.addTo(map);
}

/**
 * Add (or replace) a marker for a city with a color-coded circle.
 * @param {Object} city  { name, country, lat, lon }
 * @param {Object|null} aqiData  { aqi } or null while loading
 */
function setCityMarker(city, aqiData) {
    const key = `${city.name}|${city.lat.toFixed(3)},${city.lon.toFixed(3)}`;

    // Rate each city on the standard appropriate to its country
    // (CPCB/NAQI for India, US EPA elsewhere).
    const standard = standardForCity(city);
    const scaled = aqiData && aqiData.standards && aqiData.standards[standard]
        ? aqiData.standards[standard]
        : null;
    const aqiVal = scaled ? scaled.aqi : null;

    const cat = aqiVal !== null ? getAqiCategory(aqiVal, standard) : null;
    const color = cat ? cat.color : "#94a3b8";

    const marker = L.circleMarker([city.lat, city.lon], {
        radius: Math.max(9, Math.min(22, (aqiVal !== null ? aqiVal : 25) / 12)),
        color: "#111111",
        weight: 2,
        fillColor: color,
        fillOpacity: 0.85
    }).addTo(map);

    marker.bindTooltip(
        `<strong>${city.name}</strong><br>AQI: ${aqiVal !== null ? aqiVal : "…"} (${AQI_STANDARDS[standard].short})`,
        { direction: "top", offset: [0, -8] }
    );

    marker.on("click", () => onSelect && onSelect(city));

    // Replace any previous marker for this city.
    if (markers.has(key)) {
        map.removeLayer(markers.get(key));
    }
    markers.set(key, marker);
}

/**
 * Fly the map to a city and open its selection state.
 * @param {Object} city
 */
function focusCity(city) {
    map.flyTo([city.lat, city.lon], 7, { duration: 0.8 });
}

/**
 * Fit the map to show all default cities at startup.
 */
function fitToCities() {
    const bounds = L.latLngBounds(DEFAULT_CITIES.map(c => [c.lat, c.lon]));
    map.fitBounds(bounds, { padding: [40, 40] });
}


// ==== js/app.js ====
// ============================================================
// app.js — orchestration: data loading, UI rendering, events
// ============================================================





// ---------- State ----------
let selectedCity = null;
let lastResult = null;
let refreshTimer = null;

// ---------- Element refs ----------
const el = {
    loading: document.getElementById("loadingState"),
    errorState: document.getElementById("errorState"),
    errorText: document.getElementById("errorText"),
    cityDetails: document.getElementById("cityDetails"),
    cityName: document.getElementById("cityName"),
    cityMeta: document.getElementById("cityMeta"),
    updatedAt: document.getElementById("updatedAt"),
    aqiValue: document.getElementById("aqiValue"),
    aqiRing: document.getElementById("aqiRing"),
    aqiCategory: document.getElementById("aqiCategory"),
    dominantPollutant: document.getElementById("dominantPollutant"),
    alertBanner: document.getElementById("alertBanner"),
    alertText: document.getElementById("alertText"),
    pollutantList: document.getElementById("pollutantList"),
    refreshBtn: document.getElementById("refreshBtn"),
    aqiStandard: document.getElementById("aqiStandard"),
    legend: document.getElementById("mapLegend"),
    searchForm: document.getElementById("searchForm"),
    searchInput: document.getElementById("searchInput")
};

// ---------- Helpers ----------

function show(element) { element.classList.remove("hidden"); }
function hide(element) { element.classList.add("hidden"); }

/**
 * Render the map legend for the given AQI standard.
 */
function renderLegend(standard) {
    const std = AQI_STANDARDS[standard] || AQI_STANDARDS.us;
    el.legend.innerHTML = std.categories.map(c =>
        `<span class="legend-item"><span class="legend-swatch" style="background:${c.color}"></span>${c.label}</span>`
    ).join("");
    el.legend.setAttribute("aria-label", `AQI legend — ${std.label}`);
}

/**
 * Render the details panel from a result object.
 */
function renderDetails(city, result) {
    hide(el.loading);
    hide(el.errorState);
    show(el.cityDetails);

    el.cityName.textContent = city.name;
    el.cityMeta.textContent = [city.admin1, city.country].filter(Boolean).join(", ");
    el.updatedAt.textContent = result.fetchedAt.toLocaleTimeString("en-GB");

    // Rate the city on the standard appropriate to its country
    // (CPCB NAQI for India, US EPA elsewhere) from the same concentrations.
    const standard = standardForCity(city);
    const stdDef = AQI_STANDARDS[standard];
    const scaled = result.standards ? result.standards[standard] : null;
    const cat = scaled ? getAqiCategory(scaled.aqi, standard) : null;
    const aqi = scaled && typeof scaled.aqi === "number" ? scaled.aqi : "--";
    const bg = cat ? cat.color : "#94a3b8";

    renderLegend(standard);

    el.aqiValue.textContent = aqi;
    el.aqiRing.style.setProperty("--ring", cat ? cat.color : "#94a3b8");
    el.aqiCategory.textContent = cat ? cat.label : "Unknown";
    el.aqiCategory.style.background = bg;
    el.aqiCategory.style.color = readableTextColor(bg);
    el.aqiStandard.textContent = `AQI · ${stdDef.short}`;
    el.dominantPollutant.textContent =
        scaled && scaled.dominant ? `Main pollutant: ${pollutantLabel(scaled.dominant)}` : "Main pollutant: —";

    // Health alert banner at the standard's alert threshold
    // (Unhealthy 151+ on US EPA, Poor 201+ on India CPCB).
    if (cat && typeof aqi === "number" && aqi >= stdDef.alertMin) {
        el.alertText.textContent = cat.advice;
        show(el.alertBanner);
    } else {
        hide(el.alertBanner);
    }

    // Pollutant breakdown bars.
    el.pollutantList.innerHTML = "";
    for (const p of POLLUTANTS) {
        const value = result.pollutants[p.key];
        if (typeof value !== "number") continue;
        const pct = Math.min(100, Math.round((value / p.barMax) * 100));
        const subCat = getAqiCategoryByConc(p.key, value, standard);

        const row = document.createElement("div");
        row.className = "pollutant-row";
        row.innerHTML = `
            <span class="pollutant-name">${p.label}</span>
            <span class="pollutant-bar-track">
                <span class="pollutant-bar" style="width:${pct}%;background:${subCat ? subCat.color : "#64748b"}"></span>
            </span>
            <span class="pollutant-value">${value.toFixed(1)} µg/m³</span>
        `;
        el.pollutantList.appendChild(row);
    }
}

/**
 * Rough per-pollutant category from its concentration, for bar coloring.
 * Uses the standard's sub-index, clamped to category colors.
 */
function getAqiCategoryByConc(pollutantKey, conc, standard = "us") {
    const subIndex = pollutantSubIndex(pollutantKey, conc, standard);
    return subIndex === null ? null : getAqiCategory(subIndex, standard);
}

/**
 * Pick black or white text for a colored badge background, by relative
 * luminance — keeps "Hazardous" (near-black maroon) legible.
 */
function readableTextColor(hexBg) {
    let h = hexBg.replace("#", "");
    if (h.length === 3) h = h.split("").map((c) => c + c).join("");
    const lin = (v) => {
        const c = parseInt(v, 16) / 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    };
    const lum =
        0.2126 * lin(h.slice(0, 2)) +
        0.7152 * lin(h.slice(2, 4)) +
        0.0722 * lin(h.slice(4, 6));
    return lum > 0.35 ? "#111111" : "#ffffff";
}

// ---------- Data loading ----------

async function selectCity(city) {
    selectedCity = city;
    focusCity(city);

    show(el.loading);
    hide(el.errorState);
    hide(el.cityDetails);

    try {
        const result = await fetchAirQuality(city.lat, city.lon);
        lastResult = { city, result };
        renderDetails(city, result);
    } catch (err) {
        console.error("Failed to load air quality:", err);
        el.errorText.textContent = `Could not load data for ${city.name}: ${err.message}`;
        hide(el.loading);
        hide(el.cityDetails);
        show(el.errorState);
    }
}

async function loadDefaultCities() {
    // Fetch each city in parallel; each marker appears as its data arrives.
    await Promise.all(DEFAULT_CITIES.map(async city => {
        try {
            const result = await fetchAirQuality(city.lat, city.lon);
            setCityMarker(city, result);
        } catch (err) {
            console.warn(`Could not load AQI for ${city.name}:`, err);
            setCityMarker(city, null); // gray marker
        }
    }));
}

// ---------- Events ----------

el.refreshBtn.addEventListener("click", () => {
    if (selectedCity) selectCity(selectedCity);
});

el.searchForm.addEventListener("submit", async e => {
    e.preventDefault();
    const query = el.searchInput.value.trim();
    if (!query) return;

    el.searchInput.disabled = true;
    try {
        const results = await searchCity(query);
        if (results.length === 0) {
            el.searchInput.setCustomValidity("");
            alert(`No city found for "${query}"`);
            return;
        }
        // Take the top match.
        const top = results[0];
        selectCity({ name: top.name, country: top.country, admin1: top.admin1, lat: top.lat, lon: top.lon });
    } catch (err) {
        console.error("Search failed:", err);
        alert(`Search failed: ${err.message}`);
    } finally {
        el.searchInput.disabled = false;
        el.searchInput.value = "";
    }
});

// ---------- Init ----------

initMap(city => selectCity(city));
renderLegend("us");
loadDefaultCities();

// Auto-refresh every 10 minutes.
refreshTimer = setInterval(() => {
    if (selectedCity) selectCity(selectedCity);
    loadDefaultCities();
}, 10 * 60 * 1000);

</script>
